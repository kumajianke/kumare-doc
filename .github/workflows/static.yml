# SveltePress 部署脚本 (使用 Bun)
name: Deploy SveltePress to Pages

on:
  push:
    branches: ["main"] # 如果你的主分支叫 master，请改成 master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 修改：配置 Bun 环境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest # 这里默认使用最新版，也可以指定如 '1.1.0'

      # 2. 修改：使用 bun 安装依赖
      - name: Install dependencies
        run: bun install

      # 3. 修改：使用 bun 执行打包
      - name: Build project
        run: bun run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 请确保使用 bun build 后的输出目录依然是 dist/
          # 如果 SveltePress 配置了其他输出目录(例如 build/)，请将此处修改为对应的目录
          path: 'dist/' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
